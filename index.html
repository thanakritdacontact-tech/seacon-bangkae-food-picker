    dialog{width:min(570px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:0;border-radius:8px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 30px 100px rgba(0,0,0,.45)}dialog::backdrop{background:rgba(19,23,52,.74);backdrop-filter:blur(4px)}.modal{padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:12px}.modal-head b{font:800 13px Manrope,sans-serif;letter-spacing:0}.close{width:44px;height:44px;border:1px solid #d6d9e1;border-radius:50%;background:#f3f4f7;color:var(--ink);cursor:pointer;font-size:24px;line-height:1}.wheel-wrap{position:relative;width:min(380px,76vw);aspect-ratio:1;margin:20px auto}.pointer{position:absolute;z-index:2;left:50%;top:-2px;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--primary)}#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 10px 28px rgba(37,49,109,.22)}.winner{text-align:center;min-height:72px}.winner h2{margin:4px 0;font-size:27px;line-height:1.25}.winner p{margin:0;color:var(--muted)}.winner a{color:var(--primary);font-weight:700}.dialog-actions{display:flex;gap:8px;margin-top:17px}.dialog-actions .btn{flex:1}.note{padding:0 0 160px;color:var(--muted);font-size:12px}

    @media(max-width:520px){:root{--tray-height:124px}.nav{min-height:60px}.brand{font-size:12px}.intro h1{font-size:32px}.intro-copy{font-size:16px}.control-grid{grid-template-columns:1fr}.control-grid #search,.control-grid #quick{grid-column:auto}.results-head{align-items:start}.results-head h2{font-size:23px}.grid{grid-template-columns:1fr}.image{aspect-ratio:16/10}.tray{bottom:max(7px,env(safe-area-inset-bottom));width:calc(100% - 14px);grid-template-columns:1fr;padding:9px}.picked{grid-row:1}.tray-actions{grid-row:2}.tray-actions .btn:last-child{flex:1}.tray.is-empty .picked,.tray.is-empty #clear{display:none}.tray.is-empty .tray-actions{grid-row:1}.note{padding-bottom:145px}}

  </style>

<body>
  <a class="skip" href="#results">ข้ามไปยังรายชื่อร้าน</a>
  <header class="topbar"><div class="wrap nav"><div class="brand" id="brand">SEACON BANGKAE FOOD PICKER</div><div class="place"><span id="place"></span> · <a class="source-link" href="restaurants.csv">ข้อมูลร้าน</a></div></div></header>
  <main>
    <section class="wrap intro" aria-labelledby="pageTitle"><div><div class="kicker" id="kicker"></div><h1 id="pageTitle">Seacon Bangkae <span>Food Picker</span></h1><p class="intro-copy" id="description"></p></div><div class="stat"><b id="total">0</b><span>ร้านที่ตรวจสอบแล้ว</span></div></section>
    <section class="controls" aria-label="ค้นหาและกรองร้าน"><div class="filter-shell"><div class="wrap"><div class="control-grid"><input class="field" id="search" type="search" aria-label="ค้นหาชื่อร้าน" placeholder="ค้นหาชื่อร้าน"><select class="field" id="location" aria-label="กรองตามโซน"></select><select class="field" id="floor" aria-label="กรองตามชั้น"></select><button class="btn btn-primary" id="random">สุ่มจากผลลัพธ์</button><button class="btn btn-accent" id="quick">Quick Pick</button></div><div class="chips" id="chips" aria-label="กรองตามหมวดหมู่"></div></div></div></section>
    <section class="wrap" id="results" aria-labelledby="heading"><div class="results-head"><h2 id="heading">ร้านทั้งหมด</h2><span class="count" id="count" aria-live="polite"></span></div><div class="grid" id="grid"></div><div class="note" id="note"></div></section>
  </main>
  <aside class="tray is-empty" aria-label="ร้านที่เลือกสำหรับวงล้อ"><div class="tray-count"><span id="selectedCount">0</span>/5</div><div class="picked" id="picked"></div><div class="tray-actions"><button class="btn btn-outline" id="clear" disabled>ล้าง</button><button class="btn btn-highlight" id="openWheel" disabled>เปิดวงล้อ <span id="wheelCount">0</span>/5</button></div><div class="status" id="pickerStatus" aria-live="polite"></div></aside>
  <dialog id="wheelDialog" aria-labelledby="wheelTitle"><div class="modal"><div class="modal-head"><b id="wheelTitle">RESTAURANT WHEEL</b><button class="close" aria-label="ปิดวงล้อ">×</button></div><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="780" height="780" aria-label="วงล้อรายชื่อร้าน"></canvas></div><div class="winner" id="winner" aria-live="polite"></div><div class="dialog-actions"><button class="btn btn-outline close-action">ปิด</button><button class="btn btn-highlight" id="spin">หมุนวงล้อ</button></div></div></dialog>
  <dialog id="randomDialog" aria-labelledby="randomTitle"><div class="modal"><div class="modal-head"><b id="randomTitle">QUICK PICK</b><button class="close" aria-label="ปิดผลการสุ่ม">×</button></div><div class="winner" id="randomWinner" aria-live="polite" style="padding:38px 0 20px"></div><div class="dialog-actions"><button class="btn btn-outline close-action">ปิด</button><button class="btn btn-primary" id="again">สุ่มใหม่</button></div></div></dialog>
  <script src="mall-data.js?v=20260921-data-corrections"></script>
  <script>
    const data=window.MALL_FOOD_PICKER||{config:{},restaurants:[]},config=data.config,normalizeCategory=category=>category==='เครื่องดื่ม'?'เครื่องดื่มและคาเฟ่':category,shops=data.restaurants.map(shop=>({...shop,category:normalizeCategory(shop.category)}));
    const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    document.documentElement.lang=config.language||'th';document.title=config.site_name||'Seacon Bangkae Food Picker';for(const [name,value] of [['--primary',config.primary_color],['--accent',config.accent_color],['--highlight',config.highlight_color]])if(value)document.documentElement.style.setProperty(name,value);
    $('#brand').textContent=config.site_name||'SEACON BANGKAE FOOD PICKER';$('#place').textContent=config.mall_name||'';$('#kicker').textContent=config.kicker||'';$('#description').textContent=config.description||'';$('#note').textContent=config.source_note||'';$('#total').textContent=shops.length;
    const locations=[...new Set(shops.map(s=>s.location))],categories=['ทั้งหมด',...[...new Set(shops.map(s=>s.category))].sort((a,b)=>a.localeCompare(b,'th'))];let active='ทั้งหมด',filtered=[],spinning=false,wheelAnimation=null,lastFocus=null;const selected=new Set();
    $('#location').innerHTML='<option value="all">ทุกโซน</option>'+locations.map(x=>`<option>${esc(x)}</option>`).join('');categories.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='ทั้งหมด'?' active':'');b.textContent=c;b.setAttribute('aria-pressed',c==='ทั้งหมด');b.onclick=()=>{active=c;document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});render()};$('#chips').appendChild(b)});
    function floors(){const keep=$('#floor').value,loc=$('#location').value,list=[...new Set(shops.filter(s=>loc==='all'||s.location===loc).map(s=>s.floor))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));$('#floor').innerHTML='<option value="all">ทุกชั้น</option>'+list.map(x=>`<option value="${esc(x)}">ชั้น ${esc(x)}</option>`).join('');if(list.includes(keep))$('#floor').value=keep}
    function card(s){const isSelected=selected.has(s.id);return `<article class="shop ${isSelected?'selected':''}"><div class="image"><span class="floor-badge">${esc(s.floor)}F</span><div class="fallback" aria-hidden="true">${esc(s.name)}</div>${s.image_url?`<img src="${esc(s.image_url)}" alt="ภาพหน้าร้าน ${esc(s.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true">`:''}</div><div class="shop-body"><h3>${esc(s.name)}</h3><div class="tags"><span class="tag">${esc(s.category)}</span><span class="tag">${esc(s.location)}</span></div><div class="actions"><a class="detail" href="${esc(s.details_url)}" target="_blank" rel="noopener noreferrer">ดูแผนที่</a><button class="pick" data-id="${esc(s.id)}" aria-pressed="${isSelected}">${isSelected?'เอาออก':'เลือกเข้าวงล้อ'}</button></div></div></article>`}
    function render(){const q=$('#search').value.trim().toLocaleLowerCase('th'),loc=$('#location').value,floor=$('#floor').value;filtered=shops.filter(s=>(active==='ทั้งหมด'||s.category===active)&&(loc==='all'||s.location===loc)&&(floor==='all'||s.floor===floor)&&s.name.toLocaleLowerCase('th').includes(q));$('#heading').textContent=active==='ทั้งหมด'?'ร้านทั้งหมด':active;$('#count').textContent=`พบ ${filtered.length} จาก ${shops.length} ร้าน`;$('#grid').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty"><b>ไม่พบร้านที่ตรงกับตัวกรอง</b><br>ลองเปลี่ยนคำค้นหา ชั้น โซน หรือหมวดหมู่</div>';document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>toggle(b.dataset.id))}
    function announce(message){$('#pickerStatus').textContent='';requestAnimationFrame(()=>{$('#pickerStatus').textContent=message})}
    function toggle(id){const shop=shops.find(s=>s.id===id);if(selected.has(id)){selected.delete(id);announce(`นำ ${shop.name} ออกจากวงล้อแล้ว`)}else if(selected.size<5){selected.add(id);announce(`เพิ่ม ${shop.name} เข้าวงล้อแล้ว`)}else{announce('เลือกได้สูงสุด 5 ร้าน')}render();renderTray()}
    function renderTray(){const list=shops.filter(s=>selected.has(s.id));document.querySelector('.tray').classList.toggle('is-empty',!list.length);$('#selectedCount').textContent=list.length;$('#wheelCount').textContent=list.length;$('#picked').innerHTML=list.length?list.map(s=>`<span title="${esc(s.name)}">${esc(s.name)} <button data-remove="${esc(s.id)}" aria-label="เอา ${esc(s.name)} ออก">×</button></span>`).join(''):'<span>เลือกอย่างน้อย 2 ร้าน</span>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>toggle(b.dataset.remove));$('#clear').disabled=!list.length;$('#openWheel').disabled=list.length<2}
    function openDialog(dialog){lastFocus=document.activeElement;dialog.showModal()}
    function quick(){if(!filtered.length){announce('ไม่มีร้านในผลลัพธ์สำหรับสุ่ม');return}const s=filtered[Math.floor(Math.random()*filtered.length)];$('#randomWinner').innerHTML=`<h2>${esc(s.name)}</h2><p>${esc(s.category)} · ${esc(s.location)} ชั้น ${esc(s.floor)}<br><a href="${esc(s.details_url)}" target="_blank" rel="noopener noreferrer">ดูแผนที่ร้าน</a></p>`;openDialog($('#randomDialog'))}
    const colors=['#e64072','#25316d','#ffdc34','#087f7b','#ef7e32'];function draw(list){const c=$('#wheel'),x=c.getContext('2d'),m=c.width/2,r=m-8,step=Math.PI*2/list.length;x.clearRect(0,0,c.width,c.height);list.forEach((s,i)=>{const a=-Math.PI/2+i*step;x.beginPath();x.moveTo(m,m);x.arc(m,m,r,a,a+step);x.closePath();x.fillStyle=colors[i];x.fill();x.save();x.translate(m,m);x.rotate(a+step/2);x.textAlign='right';x.fillStyle=i===2?'#20233a':'white';x.font='700 25px IBM Plex Sans Thai';x.fillText(s.name.length>22?s.name.slice(0,20)+'…':s.name,r-32,8);x.restore()})}
    function cancelSpin(){wheelAnimation?.cancel();wheelAnimation=null;spinning=false;$('#spin').disabled=false}function openWheel(){const list=shops.filter(s=>selected.has(s.id));cancelSpin();draw(list);$('#wheel').style.transform='rotate(0deg)';$('#winner').innerHTML=`<h2>พร้อมหมุน</h2><p>${list.length} ร้านในวงล้อ</p>`;openDialog($('#wheelDialog'))}
    function spin(){if(spinning)return;const list=shops.filter(s=>selected.has(s.id));if(list.length<2)return;spinning=true;$('#spin').disabled=true;const winner=Math.floor(Math.random()*list.length),step=360/list.length,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?650:3200,turns=reduced?1:5,angle=turns*360+360-(winner+.5)*step,wheel=$('#wheel');$('#winner').innerHTML='<h2>กำลังเลือก</h2><p>วงล้อกำลังหมุน</p>';wheelAnimation=wheel.animate([{transform:'rotate(0deg)'},{transform:`rotate(${angle}deg)`}],{duration,easing:'cubic-bezier(.14,.72,.12,1)',fill:'forwards'});wheelAnimation.finished.then(()=>{const s=list[winner];wheel.style.transform=`rotate(${angle}deg)`;wheelAnimation.cancel();wheelAnimation=null;$('#winner').innerHTML=`<h2>${esc(s.name)}</h2><p>${esc(s.category)} · ${esc(s.location)} ชั้น ${esc(s.floor)}<br><a href="${esc(s.details_url)}" target="_blank" rel="noopener noreferrer">ดูแผนที่ร้าน</a></p>`;spinning=false;$('#spin').disabled=false}).catch(()=>{})}
    function closeDialog(dialog){dialog.close();lastFocus?.focus()}$('#search').oninput=render;$('#location').onchange=()=>{floors();render()};$('#floor').onchange=render;$('#random').onclick=quick;$('#quick').onclick=quick;$('#again').onclick=quick;$('#clear').onclick=()=>{selected.clear();announce('ล้างร้านที่เลือกแล้ว');render();renderTray()};$('#openWheel').onclick=openWheel;$('#spin').onclick=spin;document.querySelectorAll('.close,.close-action').forEach(b=>b.onclick=()=>closeDialog(b.closest('dialog')));document.querySelectorAll('dialog').forEach(d=>{d.onclick=e=>{if(e.target===d)closeDialog(d)};d.addEventListener('close',()=>lastFocus?.focus())});$('#wheelDialog').addEventListener('close',cancelSpin);floors();render();renderTray();
  </script>
